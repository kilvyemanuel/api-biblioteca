spring:
  application:
    name: biblioteca

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:biblioteca}
    username: ${DB_USER:biblioteca}
    password: ${DB_PASSWORD:biblioteca123}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}